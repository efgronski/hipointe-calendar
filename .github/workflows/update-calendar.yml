name: Update calendar

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest
      - run: python -m hipointe_calendar
      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/screenings.json output/hipointe.ics; then
            echo "No calendar changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/screenings.json output/hipointe.ics
          git commit -m "chore: update Hi-Pointe calendar"
          git push
